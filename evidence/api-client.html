<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lab 5 API request evidence</title>
<style>
body{font:18px Arial,sans-serif;background:#f0f3f8;color:#17243a;margin:0;padding:30px}
header{margin-bottom:24px}h1{margin:0 0 10px;font-size:30px}p{margin:8px 0;color:#526078}
.bar{display:flex;gap:14px;background:white;border:1px solid #bcc7d5;padding:18px;border-radius:8px;margin-bottom:22px;align-items:center}
select,input,button{font:18px Arial;padding:10px;border:1px solid #b4bfd0;border-radius:5px}input{flex:1}button{background:#1756c2;color:white;cursor:pointer}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid #bcc7d5;border-radius:8px;padding:20px}
h2{font-size:20px;margin:0 0 16px}textarea,pre{font:16px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{box-sizing:border-box;width:100%;height:360px;padding:14px;background:#f8faff;border:1px solid #ccd5e3;color:#17243a}
pre{margin:12px 0;min-height:300px}#status{font-weight:bold;color:#167444}.foot{margin-top:24px;font-size:15px}
</style>
<header><h1>EECE 435L · Lab 5 · Flask User API</h1><p>Browser API client — live requests and actual JSON responses</p><p id="case">Request evidence</p></header>
<div class="bar"><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input id="url" value="http://localhost:5000/api/users"><button id="send">Send request</button></div>
<div class="panels"><section class="panel"><h2>Request body · application/json</h2><textarea id="body" placeholder="No request body"></textarea></section><section class="panel"><h2>Response · application/json</h2><div id="status">Not sent</div><pre id="response"></pre></section></div>
<p class="foot">Evidence captured from this browser client against the running Flask app. This is not the Postman application.</p>
<script>
window.finished=false;
document.querySelector('#send').onclick=async()=>{
 window.finished=false;
 const method=document.querySelector('#method').value,body=document.querySelector('#body').value;
 const options={method};
 if(body && !['GET','DELETE'].includes(method)){options.headers={'Content-Type':'application/json'};options.body=body;}
 const start=performance.now();
 try{
  const res=await fetch(document.querySelector('#url').value,options);
  const text=await res.text();
  document.querySelector('#status').textContent=`HTTP ${res.status} ${res.statusText} · ${Math.round(performance.now()-start)} ms`;
  document.querySelector('#response').textContent=JSON.stringify(JSON.parse(text),null,2);
  window.lastResponse={status:res.status,body:JSON.parse(text)};
 }catch(err){document.querySelector('#status').textContent='Request failed';document.querySelector('#response').textContent=String(err);window.lastResponse={error:String(err)};}
 window.finished=true;
};
</script>
</html>
